<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<meta name="description" content="Henna designs from Hearts for Henna fundraisers and workshops at the University of Florida.">
<link rel="canonical" href="https://heartsforhennaatuf.org/gallery">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hearts for Henna at UF">
<meta property="og:title" content="Gallery | Hearts for Henna at UF">
<meta property="og:description" content="Henna designs from Hearts for Henna fundraisers and workshops at the University of Florida.">
<meta property="og:url" content="https://heartsforhennaatuf.org/gallery">
<meta property="og:image" content="https://heartsforhennaatuf.org/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#7A1A2B">
<title>Hearts for Henna Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Rochester&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--burgundy)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="announce"><a href="https://www.instagram.com/heartsforhenna/" target="_blank" rel="noopener">Follow @heartsforhenna for new designs</a></div>
<header class="g-head">
  <a class="brand" href="index.html" aria-label="Hearts for Henna home"><img src="logo.png" alt=""></a>
  <a class="pill" href="index.html">Back to home</a>
</header>

<main>
  <section class="g-hero">
    <div class="wrap">
      <div class="title"><span class="lead">Our henna</span><h2>Gallery</h2></div>
      <p>Designs from our fundraiser tables and workshops, updated every two weeks. Tap any design to view it larger.</p>
      <div class="ctas"><a class="pill light" href="https://www.instagram.com/heartsforhenna/" target="_blank" rel="noopener">Follow on Instagram</a></div>
    </div>
  </section>

  <div class="marquee gold" aria-hidden="true"><div class="run" id="marq"></div></div>

  <section class="band cream">
    <div class="wrap">
      <div class="masonry" id="masonry"></div>
      <div class="line-link right reveal"><a class="pill dark" href="https://www.instagram.com/heartsforhenna/" target="_blank" rel="noopener">See more on Instagram</a></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <a class="brand" href="index.html"><img src="logo.png" alt="">Hearts for Henna · UF</a>
    <nav aria-label="Footer"><a href="index.html">Home</a><a href="https://www.instagram.com/heartsforhenna/" target="_blank" rel="noopener">Instagram</a></nav>
  </div>
</footer>

<div class="lightbox" id="lb" hidden role="dialog" aria-modal="true" aria-label="Design viewer">
  <div class="frame-lb">
    <div id="lb-media"></div>
    <div class="bar">
      <span id="lb-count"></span>
      <div class="nav">
        <button class="pill" type="button" id="lb-prev">Previous</button>
        <button class="pill" type="button" id="lb-next">Next</button>
        <button class="pill light" type="button" id="lb-close">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script>
(function(){
  const S = window.SITE, { el, photo, reveal } = window.HFH;
  const chunk = ["Henna for a cause", "New designs every two weeks", "Hearts for Henna UF"].map(w => `<span>${w}</span>`).join("");
  document.getElementById("marq").innerHTML = chunk.repeat(4) + chunk.repeat(4);

  const ratios = ["3/4", "1/1", "4/5", "4/3", "3/4", "2/3"];
  const m = document.getElementById("masonry");
  S.gallery.forEach((g, i) => {
    const f = el("figure", "reveal"); f.style.setProperty("--d", ((i % 3) * .1) + "s");
    f.tabIndex = 0; f.setAttribute("role", "button"); f.setAttribute("aria-label", "View design " + (i + 1));
    const p = photo(g.src, g.caption || "Henna design", "design", g.src ? "" : "Photo coming soon");
    if (!g.src) p.style.aspectRatio = ratios[i % ratios.length];
    f.append(p); if (g.caption) f.append(el("figcaption", null, g.caption));
    f.addEventListener("click", () => open(i));
    f.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); open(i); } });
    m.append(f);
  });

  const lb = document.getElementById("lb"), media = document.getElementById("lb-media"), count = document.getElementById("lb-count");
  let cur = 0, lastFocus = null, sx = null;
  function show(i){
    cur = (i + S.gallery.length) % S.gallery.length;
    const g = S.gallery[cur];
    media.replaceChildren(photo(g.src, g.caption || "Henna design", "design", g.src ? "" : "Photo coming soon"));
    if (!g.src) media.firstChild.style.aspectRatio = "4/3";
    count.textContent = (cur + 1) + " / " + S.gallery.length + (g.caption ? " · " + g.caption : "");
  }
  function open(i){ lastFocus = document.activeElement; show(i); lb.hidden = false; requestAnimationFrame(() => lb.classList.add("open")); document.getElementById("lb-close").focus(); document.body.style.overflow = "hidden"; }
  function close(){ lb.classList.remove("open"); setTimeout(() => { lb.hidden = true; }, 250); document.body.style.overflow = ""; lastFocus?.focus(); }
  document.getElementById("lb-prev").onclick = () => show(cur - 1);
  document.getElementById("lb-next").onclick = () => show(cur + 1);
  document.getElementById("lb-close").onclick = close;
  lb.addEventListener("click", e => { if (e.target === lb) close(); });
  document.addEventListener("keydown", e => { if (lb.hidden) return; if (e.key === "Escape") close(); if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });
  lb.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null; }, { passive: true });

  reveal();
})();
</script>
</body>
</html>
